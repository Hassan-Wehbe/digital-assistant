# Supabase CLI config. Only the settings this repo relies on; everything else
# uses the CLI defaults. Project: digital-assistant (ref motvckmpusxiuelpwqxy).
project_id = "digital-assistant"

[functions.mcp]
# The MCP server checks the caller's Supabase access token itself, so it can
# answer unauthenticated OAuth discovery requests (401 + WWW-Authenticate)
# the way MCP clients such as the Claude app expect.
verify_jwt = false

[functions.chat]
# Like mcp: the function verifies the caller's Supabase access token itself (401 otherwise)
# and then runs every query as that user.
verify_jwt = false

[functions.delete-account]
# Like chat: the function checks the caller's sign-in itself (401 otherwise), then the password.
verify_jwt = false
