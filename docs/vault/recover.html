<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self'; connect-src https://motvckmpusxiuelpwqxy.supabase.co; base-uri 'none'; form-action 'none'">
  <title>Recover or change your vault passphrase</title>
  <link rel="stylesheet" href="vault.css" integrity="sha384-tHvFDGaW8LdFSJTcKnd8JJmP77TgS3f5t2SndNBu//lzKpG/SF0BLpy6kZu8xp9B">
  <script src="vendor/supabase.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok"></script>
  <link rel="modulepreload" href="../oauth/config.js" integrity="sha384-tckR0YVWc/lyRMtHEWFlyrxg0ZC4AOhWm1kfxHt0TsK7zPgiBFsDl7jqCaEjhHWQ">
  <link rel="modulepreload" href="vendor/libsodium-sumo.mjs" integrity="sha384-6CExmTBhGBkeU97K/q0KEN9A/d/n9q/T7WdippDhSFGAAlIneqtVzaJfmm6+LUMb">
  <link rel="modulepreload" href="vendor/libsodium-wrappers.mjs" integrity="sha384-Ure8NooPSc0DiuY0mTMBNtSIgIaxz/eFxwaKJI/PChqRbmj80CIZ4fNY5e6DXL7K">
  <link rel="modulepreload" href="crypto.js" integrity="sha384-pFUSdghKfEgqe/AeueMKDsFLljCw6WUlbdrpeeSNal7L3X8D+1G589aa4ULao9cy">
  <link rel="modulepreload" href="app.js" integrity="sha384-sEHKNjLRRO63V8TZAD/lIv1Xxn+7Bo9zwtTi5loLhqbYxG9YgR19Y3N9YO1qrE1u">
  <script type="module" src="recover.js" integrity="sha384-ffRVbla8yEDgnp+8MNr/7cUk18QubipnE0CBtPTpnt0zYe97bHC91SEAr5KPy6Im"></script>
</head>
<body>
<main>
  <h1>Vault passphrase</h1>
  <p id="status" class="muted">Loading…</p>

  <form id="login" hidden>
    <p>Sign in with your Digital Assistant account.</p>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">Account password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <div class="row"><button class="primary" type="submit">Sign in</button></div>
  </form>

  <form id="change" hidden autocomplete="off">
    <p>Set a new unlock passphrase. Your secrets and your recovery key stay the same.</p>
    <label class="check"><input type="radio" name="mode" value="recovery" id="mode-recovery" checked>
      <span>I forgot my passphrase: use my <strong>recovery key</strong></span></label>
    <label class="check"><input type="radio" name="mode" value="passphrase" id="mode-passphrase">
      <span>I know my passphrase and want to change it</span></label>

    <div id="by-recovery">
      <label for="recovery-key">Recovery key</label>
      <input id="recovery-key" autocomplete="off" autocapitalize="characters" spellcheck="false">
    </div>
    <div id="by-passphrase" hidden>
      <label for="old-pass">Current passphrase</label>
      <input id="old-pass" type="password" autocomplete="off">
    </div>

    <label for="pass1">New unlock passphrase (at least 12 characters)</label>
    <div class="field"><input id="pass1" type="password" autocomplete="off" minlength="12" required></div>
    <label for="pass2">Type it again</label>
    <input id="pass2" type="password" autocomplete="off" required>
    <div class="row"><button class="primary" type="submit">Set new passphrase</button></div>
  </form>

  <section id="done" hidden>
    <p class="ok"><strong>Done.</strong> Use the new passphrase from now on. Your recovery key has not changed.</p>
  </section>

  <section id="nosetup" hidden>
    <p>Your vault is not set up yet. <a href="setup">Set it up</a>.</p>
  </section>

  <p id="account" class="muted" hidden>Signed in as <span id="who"></span> · <a href="#" id="signout">Sign out</a></p>
</main>
</body>
</html>
