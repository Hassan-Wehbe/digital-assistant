<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src https://motvckmpusxiuelpwqxy.supabase.co; base-uri 'none'; form-action 'none'">
  <title>Digital Assistant sign-in</title>
  <link rel="stylesheet" href="consent.css" integrity="sha384-6dIYNJOd1HBtMCMATwmP36RUgETQFtDbc/em/lJbXyDFRqxaYjvCd2uojb4pe90M">
  <script src="../vault/vendor/supabase.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok"></script>
  <link rel="modulepreload" href="config.js" integrity="sha384-tckR0YVWc/lyRMtHEWFlyrxg0ZC4AOhWm1kfxHt0TsK7zPgiBFsDl7jqCaEjhHWQ">
  <script type="module" src="consent.js" integrity="sha384-cESEWj/ndFRsEy/0eiZ7inlMj59pDKapMQUCFwJYk9ThOi5m4MfbGCvmvLf4/klt"></script>
</head>
<body>
<main>
  <h1>Digital Assistant</h1>
  <p id="status" class="muted">Loading…</p>

  <form id="login" hidden>
    <p>Sign in to connect an app to your assistant.</p>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <div class="row"><button class="primary" type="submit">Sign in</button></div>
  </form>

  <section id="consent" hidden>
    <p><strong id="client-name"></strong> wants to use your Digital Assistant: read and add
       to your spaces and items, signed in as <strong id="user-email"></strong>.</p>
    <p class="muted">Restricted spaces stay out of search. Only approve apps you added yourself.</p>
    <dl>
      <dt>Returns to</dt><dd id="redirect"></dd>
      <dt>Scopes</dt><dd id="scopes"></dd>
    </dl>
    <div class="row">
      <button id="deny" type="button">Deny</button>
      <button id="approve" class="primary" type="button">Approve</button>
    </div>
    <p class="muted"><a href="#" id="signout">Not you? Sign out</a></p>
  </section>
</main>

</body>
</html>
