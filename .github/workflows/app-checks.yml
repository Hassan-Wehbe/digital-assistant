# Lint, type-check, unit tests and Expo's doctor for the mobile app (app/).
name: app checks
on:
  pull_request:
    paths: ["app/**", ".github/workflows/app-checks.yml"]
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app-checks.yml"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npx -y expo-doctor
